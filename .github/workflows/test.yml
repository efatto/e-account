name: tests

on:
  pull_request:
    branches:
      - "12.0*"
  push:
    branches:
      - "12.0"
      - "12.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # reject non-comment lines that contain a / (i.e. URLs, relative paths)
                  grep "^[^#].*/" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-20.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.6-ocb12.0:latest
            name: test with OCB
            makepot: "false"
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pip install PR
        run: pip3 install -e "git+https://github.com/efatto/mis-builder@12.0-imp-mis_builder-query-drilldown-filtered#egg=odoo12-addon-mis_builder&subdirectory=setup/mis_builder"
      - name: Install account_analytic_mrp_extra_cost module from efatto repo
        run: pip3 install -e "git+https://github.com/efatto/efatto@12.0#egg=odoo12-addon-account_analytic_mrp_extra_cost&subdirectory=setup/account_analytic_mrp_extra_cost"
      - name: Install mrp_sale_info_link module from efatto repo
        run: pip3 install -e "git+https://github.com/efatto/efatto@12.0#egg=odoo12-addon-mrp_sale_info_link&subdirectory=setup/mrp_sale_info_link"
      - name: Install mrp_production_demo module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_production_demo&subdirectory=setup/mrp_production_demo"
      - name: Install mrp_workorder_time module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_workorder_time&subdirectory=setup/mrp_workorder_time"
      - name: Install mrp_employee_productivity module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_employee_productivity&subdirectory=setup/mrp_employee_productivity"
      - name: Install mrp_workorder_timesheet_cost module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_workorder_timesheet_cost&subdirectory=setup/mrp_workorder_timesheet_cost"
      - name: Install product_finishing module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-product_finishing&subdirectory=setup/product_finishing"
      - name: Install product_template_replenishment_cost module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-product_template_replenishment_cost&subdirectory=setup/product_template_replenishment_cost"
      - name: Install mrp_bom_operation_estimate module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_bom_operation_estimate&subdirectory=setup/mrp_bom_operation_estimate"
      - name: Install purchase_seller_evaluation module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-purchase_seller_evaluation&subdirectory=setup/purchase_seller_evaluation"
      - name: Install account_analytic_mrp_extra_cost module from efatto repo
        run: pip3 install -e "git+https://github.com/efatto/efatto@12.0#egg=odoo12-addon-account_analytic_mrp_extra_cost&subdirectory=setup/account_analytic_mrp_extra_cost"
      - name: Install sale_order_analytic_all module from e-account repo
        run: pip3 install -e "git+https://github.com/efatto/e-account@12.0#egg=odoo12-addon-sale_order_analytic_all&subdirectory=setup/sale_order_analytic_all"
      - name: Install mrp_bom_evaluation module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_bom_evaluation&subdirectory=setup/mrp_bom_evaluation"
      - name: Install product_pricelist_bom_cost module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-product_pricelist_bom_cost&subdirectory=setup/product_pricelist_bom_cost"
      - name: Install mrp_bom_sale_pricelist module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_bom_sale_pricelist&subdirectory=setup/mrp_bom_sale_pricelist"
      - name: Install mrp_production_procurement_analytic module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_production_procurement_analytic&subdirectory=setup/mrp_production_procurement_analytic"
      - name: Install mrp_production_manual_procurement module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-mrp_production_manual_procurement&subdirectory=setup/mrp_production_manual_procurement"
      - name: Install purchase_requisition_grouping module from e-efatto repo
        run: pip3 install -e "git+https://github.com/efatto/e-efatto@12.0#egg=odoo12-addon-purchase_requisition_grouping&subdirectory=setup/purchase_requisition_grouping"
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'efatto' }}
